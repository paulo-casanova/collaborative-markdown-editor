services:
  postgres:
    image: postgres:16-alpine
    container_name: cme-postgres-prod
    environment:
      POSTGRES_USER: cme
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cme_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cme -d cme_prod"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - cme-network

  cme-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cme-server-prod
    environment:
      CME_DATABASE_URL: "postgresql://cme:secret@postgres:5432/cme_prod"
      CME_STORAGE_ROOT_PATH: "/var/lib/cme/storage"
      CME_SERVER_BIND: "0.0.0.0"
      CME_SERVER_PORT: "8080"
      CME_UI_EMBEDDED: "true"
      CME_UI_DIST_DIR: "/var/lib/cme/frontend/dist"
      CME_AUTHN_PROVIDER: "delegated"
      CME_AUTHN_DELEGATED_HEADER: "X-Remote-User"
      CME_AUTHN_DELEGATED_EMAIL_HEADER: "X-Remote-Email"
    volumes:
      - cme_storage_prod:/var/lib/cme/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    networks:
      - cme-network

  nginx:
    image: nginx:alpine
    container_name: cme-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      cme-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cme-network

networks:
  cme-network:
    driver: bridge

volumes:
  postgres_prod_data:
  cme_storage_prod:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cme-icon-light.png" id="cme-favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative Markdown Editor (CME)</title>

    <!-- FOUC & Theme Initialization Script -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cme-theme') || 'system';
          var resolved = stored;
          if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var favicon = document.getElementById('cme-favicon');
          if (favicon) {
            favicon.href = resolved === 'dark' ? '/cme-icon-dark.png' : '/cme-icon-light.png';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-cme-bg-base text-cme-text-base antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
